[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "nebius-serverless-prototype"
version = "0.0.1"
description = "Python client for Nebius Serverless AI Jobs"
requires-python = ">=3.10"
dependencies = [
    "nebius==0.6.27",
    "PyYAML==6.0.3",
    "rich==15.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.14.2",
]

[tool.ruff]
line-length = 79
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
